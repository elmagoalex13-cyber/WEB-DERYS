<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #050505; --panel: #000; --text: #fff; --muted: rgba(255,255,255,.54); --soft: rgba(255,255,255,.12); --blue: #6c7dff; }
html, body { min-height: 100vh; background: #0d0d0d; color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
.page { width: min(100%, 460px); min-height: 100vh; margin: 0 auto; background: var(--panel); border-left: 1px solid rgba(255,255,255,.14); border-right: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
.hero { width: 100%; aspect-ratio: 4 / 4.05; position: relative; overflow: hidden; border-radius: 0 0 26px 26px; background: #181818; }
.hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 38%, rgba(0,0,0,.44) 66%, #000 100%); pointer-events: none; }
.hero-content { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.profile-name { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: clamp(1.55rem, 7vw, 2.1rem); line-height: 1; font-weight: 800; letter-spacing: -.02em; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.72); }
.verified-badge { width: 24px; height: 24px; flex: 0 0 24px; filter: drop-shadow(0 2px 8px rgba(88,101,242,.52)); }
.hero-socials { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.hero-social { width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; color: #fff; background: rgba(0,0,0,.34); backdrop-filter: blur(7px); text-decoration: none; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
.hero-social:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.34); }
.hero-social svg { width: 15px; height: 15px; }
.main { padding: 12px 12px 24px; }
.prompt { display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 38px; margin: 0 auto 8px; font-size: .86rem; font-weight: 800; color: #fff; text-align: center; }
.of-card { display: block; position: relative; overflow: hidden; width: 100%; aspect-ratio: 4 / 2.38; border-radius: 11px; background: #151515; color: #fff; text-decoration: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); touch-action: manipulation; }
.of-card img { width: 100%; height: 100%; object-fit: cover; object-position: 42% 22%; display: block; transition: transform .28s ease; }
.of-card:hover img { transform: scale(1.025); }
.of-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.02) 32%, rgba(0,0,0,.72) 100%); pointer-events: none; }
.of-logo { position: absolute; top: 14px; left: 14px; z-index: 2; width: 35px; height: 35px; display: grid; place-items: center; border-radius: 50%; background: #00aff0; box-shadow: 0 3px 12px rgba(0,0,0,.45); }
.of-logo img { width: 25px; height: 25px; object-fit: contain; filter: brightness(0) invert(1); }
.of-title { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 2; text-align: center; font-size: clamp(.92rem, 4.2vw, 1.08rem); line-height: 1.1; font-weight: 900; letter-spacing: -.01em; text-shadow: 0 2px 18px rgba(0,0,0,.9); }
.social-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.social-card { display: block; position: relative; overflow: hidden; aspect-ratio: 1 / 1.12; border-radius: 11px; background: #151515; color: #fff; text-decoration: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); touch-action: manipulation; transition: transform .18s ease; }
.social-card:hover { transform: translateY(-2px); }
.social-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .28s ease; }
.social-card:hover img { transform: scale(1.03); }
.social-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.02) 36%, rgba(0,0,0,.78) 100%); pointer-events: none; }
.social-icon { position: absolute; top: 10px; left: 10px; z-index: 2; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.32); color: #fff; backdrop-filter: blur(6px); }
.social-icon svg { width: 15px; height: 15px; }
.social-title { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 2; text-align: center; font-size: .92rem; line-height: 1.1; font-weight: 900; text-shadow: 0 2px 16px rgba(0,0,0,.9); }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.hero, .prompt, .of-card, .social-links { animation: up .45s ease both; }
.prompt { animation-delay: .08s; }
.of-card { animation-delay: .12s; }
.social-links { animation-delay: .16s; }
@media (max-width: 400px) {
  .page { border-left: 0; border-right: 0; }
  .main { padding-left: 10px; padding-right: 10px; }
  .hero { border-radius: 0 0 22px 22px; }
  .of-card { border-radius: 10px; }
  .verified-badge { width: 22px; height: 22px; flex-basis: 22px; }
  .hero-social { width: 29px; height: 29px; }
  .social-title { font-size: .86rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

<script>
(function(){
  var HALO_ENDPOINT='https://halo-panel.vercel.app/api/landing-track';
  var HALO_LANDING_SLUG='rachel-sweet';
  var HALO_LANDING_KEY='lk_rachel_sweet_cambia_esto';
  var SESSION_KEY='halo_landing_session_rachel_sweet';

  function getSessionId(){
    try{
      var id=localStorage.getItem(SESSION_KEY);
      if(!id){
        id=(crypto.randomUUID&&crypto.randomUUID())||(Math.random().toString(36).slice(2)+Date.now().toString(36));
        localStorage.setItem(SESSION_KEY,id);
      }
      return id;
    }catch(e){
      return Math.random().toString(36).slice(2)+Date.now().toString(36);
    }
  }

  function trackHaloLanding(eventType,extra){
    var payload=JSON.stringify(Object.assign({
      landingSlug:HALO_LANDING_SLUG,
      landingKey:HALO_LANDING_KEY,
      eventType:eventType,
      sessionId:getSessionId(),
      referrer:document.referrer,
      page:location.pathname,
      url:location.href,
      userAgent:navigator.userAgent,
      timestamp:new Date().toISOString()
    },extra||{}));

    if(navigator.sendBeacon){
      navigator.sendBeacon(HALO_ENDPOINT,new Blob([payload],{type:'application/json'}));
      return;
    }

    fetch(HALO_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      keepalive:true,
      body:payload
    }).catch(function(){});
  }

  trackHaloLanding('pageview');

  document.addEventListener('click', function(event){
    var link = event.target.closest && event.target.closest('a[href]');
    if(!link) return;

    var href = link.href || link.getAttribute('href') || '';
    var text = (link.getAttribute('aria-label') || link.textContent || '').trim().slice(0,80);
    var isOnlyFans = /onlyfans/i.test(href) || link.hasAttribute('data-halo-of-click');
    var isLinksPage = /links\.html/i.test(href) || /links/i.test(text);

    trackHaloLanding('click', {
      label: link.getAttribute('data-halo-of-click') ||
        link.getAttribute('data-halo-click') ||
        (isOnlyFans ? 'onlyfans' : isLinksPage ? 'links-page' : text || 'link'),
      destination: href
    });
  }, true);
})();
</script>
<script>
(function(){
  var VERSION=Date.now().toString();
  var DEFAULT_EXTENSIONS=['jpg','jpeg','png','webp','avif','gif','svg',''];
  document.querySelectorAll('img[data-src-base]').forEach(function(img){
    var base=img.getAttribute('data-src-base');
    var extensions=(img.getAttribute('data-src-exts')||DEFAULT_EXTENSIONS.join(',')).split(',');
    var index=0;
    var tried={};
    tried[img.getAttribute('src')]=true;
    function tryNext(){
      while(index<extensions.length){
        var extension=extensions[index++].trim();
        var nextSrc=base+(extension?'.'+extension:'')+'?v='+VERSION;
        if(tried[nextSrc])continue;
        tried[nextSrc]=true;
        img.src=nextSrc;
        return;
      }
    }
    img.addEventListener('error',tryNext);
    tryNext();
  });
})();
</script>
