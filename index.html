<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #050505; --panel: #000; --text: #fff; --muted: rgba(255,255,255,.54); --soft: rgba(255,255,255,.12); --blue: #6c7dff; }
html, body { min-height: 100vh; background: #0d0d0d; color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
.page { width: min(100%, 460px); min-height: 100vh; margin: 0 auto; background: var(--panel); border-left: 1px solid rgba(255,255,255,.14); border-right: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 70px rgba(0,0,0,.45); }

.verified-badge { width: 24px; height: 24px; flex: 0 0 24px; filter: drop-shadow(0 2px 8px rgba(88,101,242,.52)); }
.hero-socials { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.hero-social { width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; color: #fff; background: rgba(0,0,0,.34); backdrop-filter: blur(7px); text-decoration: none; transition: transform .18s ease, background .18s ease, border-color .18s ease; }

.of-card { display: block; position: relative; overflow: hidden; width: 100%; aspect-ratio: 4 / 2.38; border: 0; border-radius: 11px; padding: 0; background: #151515; color: #fff; font: inherit; text-align: inherit; text-decoration: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); appearance: none; cursor: pointer; touch-action: manipulation; }

.manual-continue { background: #fff; color: #090909; }
.debug-panel { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 15; max-width: 440px; margin: 0 auto; border: 1px solid rgba(236,72,153,.32); border-radius: 12px; padding: 10px 12px; background: rgba(0,0,0,.86); color: #fff; font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.debug-panel[hidden] { display: none; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.hero, .prompt, .of-card, .social-links { animation: up .45s ease both; }
.prompt { animation-delay: .08s; }

@media (max-width: 400px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<script>
(function(){
  var HALO_ENDPOINT='https://halo-panel.vercel.app/api/landing-track';
  var HALO_LANDING_SLUG='rachel-sweet';
  var HALO_LANDING_KEY='lk_rachel_sweet_cambia_esto';
  var SESSION_KEY='halo_landing_session_rachel_sweet';

  function getSessionId(){
    try{
      var id=localStorage.getItem(SESSION_KEY);
      if(!id){
        id=(crypto.randomUUID&&crypto.randomUUID())||(Math.random().toString(36).slice(2)+Date.now().toString(36));
        localStorage.setItem(SESSION_KEY,id);
      }
      return id;
    }catch(e){
      return Math.random().toString(36).slice(2)+Date.now().toString(36);
    }
  }

  function trackHaloLanding(eventType,extra){
    var payload=JSON.stringify(Object.assign({
      landingSlug:HALO_LANDING_SLUG,
      landingKey:HALO_LANDING_KEY,
      eventType:eventType,
      sessionId:getSessionId(),
      referrer:document.referrer,
      page:location.pathname,
      url:location.href,
      userAgent:navigator.userAgent,
      timestamp:new Date().toISOString()
    },extra||{}));

    if(navigator.sendBeacon){
      navigator.sendBeacon(HALO_ENDPOINT,new Blob([payload],{type:'application/json'}));
      return;
    }

    fetch(HALO_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      keepalive:true,
      body:payload
    }).catch(function(){});
  }

  document.addEventListener('halo-track',function(event){
    var detail=event&&event.detail||{};
    trackHaloLanding(detail.eventType||'click',detail.extra||{});
  });
  try{ window.trackHaloLanding=trackHaloLanding; }catch(error){}
  trackHaloLanding('pageview');

  document.addEventListener('click', function(event){
    var link = event.target.closest && event.target.closest('a[href]');
    if(!link) return;

    var href = link.href || link.getAttribute('href') || '';
    var text = (link.getAttribute('aria-label') || link.textContent || '').trim().slice(0,80);
    var isOnlyFans = /onlyfans/i.test(href) || link.hasAttribute('data-halo-of-click');
    var isLinksPage = /links\.html/i.test(href) || /links/i.test(text);

    trackHaloLanding('click', {
      label: link.getAttribute('data-halo-of-click') ||
        link.getAttribute('data-halo-click') ||
        (isOnlyFans ? 'onlyfans' : isLinksPage ? 'links-page' : text || 'link'),
      destination: href
    });
  }, true);
})();
</script>
<script>
(function(){
  var OF_PARTS=["c3B0dGg=","bm8vLzo=","bmFmeWw=","bW9jLnM=","ZWRlZC8=","aXRhbGU=","bHJpZ24=","MmMv"];
  var pending=false;
  var fallbackTimer=null;
  var driftTimer=null;
  var lastTick=0;
  var currentTarget="";

  function decodeTarget(parts){
    try{
      return (parts||[]).map(function(part){
        return decodeURIComponent(escape(atob(part))).split("").reverse().join("");
      }).join("");
    }catch(error){
      return "";
    }
  }

  function userAgent(){
    return navigator.userAgent||"";
  }

  function detectApp(ua){
    ua=ua||"";
    if(/musical_ly|BytedanceWebview|TikTok/i.test(ua))return "tiktok";
    if(/Barcelona/i.test(ua))return "threads";
    if(/Instagram/i.test(ua))return "instagram";
    if(/FBAN|FBAV|FB_IAB|FBIOS|FB4A/i.test(ua))return "facebook";
    if(/WhatsApp/i.test(ua))return "whatsapp";
    if(/Twitter|X\/|TwitterAndroid|Twitter for iPhone/i.test(ua))return "x";
    if(/Telegram/i.test(ua))return "telegram";
    if(/LinkedInApp|LinkedIn/i.test(ua))return "linkedin";
    return "normal";
  }

  function detectOS(ua){
    ua=ua||"";
    if(/iPhone|iPad|iPod/i.test(ua))return "ios";
    if(/Android/i.test(ua))return "android";
    return "other";
  }

  function buildAndroidIntent(url){
    var parsed;
    try{ parsed=new URL(url); }
    catch(error){ return url; }
    return "intent://"+parsed.host+parsed.pathname+parsed.search+parsed.hash+
      "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+
      encodeURIComponent(url)+";end";
  }

  function getLaunchPlan(url,ua){
    var app=detectApp(ua);
    var platform=detectOS(ua);
    var scheme=url;
    var mode="direct";

    if(platform==="ios"){
      if(app==="instagram"){
        mode="ios-external";
        scheme="instagram://extbrowser/?url="+encodeURIComponent(url);
      }else if(app==="threads"){
        mode="ios-external";
        scheme="barcelona://extbrowser/?url="+encodeURIComponent(url);
      }else if(app==="tiktok"){
        mode="manual";
        scheme="";
      }else if(app!=="normal"){
        mode="ios-external";
        scheme="x-safari-"+url;
      }
    }else if(platform==="android"&&app!=="normal"){
      mode="android-intent";
      scheme=buildAndroidIntent(url);
    }

    return {app:app, os:platform, mode:mode, scheme:scheme};
  }

  function clearFallbackWatch(){
    if(fallbackTimer)clearTimeout(fallbackTimer);
    if(driftTimer)clearInterval(driftTimer);
    fallbackTimer=null;
    driftTimer=null;
    lastTick=0;
  }

  function markLeftApp(){
    if(!pending)return;
    pending=false;
    clearFallbackWatch();
  }

  function showManual(url){
    var modal=document.getElementById("manual-open");
    var copy=document.getElementById("manual-copy");
    var follow=document.getElementById("manual-continue");
    if(!modal||!copy||!follow)return;
    currentTarget=url;
    pending=false;
    clearFallbackWatch();
    modal.hidden=false;
    document.documentElement.classList.add("modal-lock");
    document.body.classList.add("modal-lock");
    setTimeout(function(){ copy.focus(); },0);
  }

  function closeManual(){
    var modal=document.getElementById("manual-open");
    if(modal)modal.hidden=true;
    document.documentElement.classList.remove("modal-lock");
    document.body.classList.remove("modal-lock");
  }

  function watchIOSFallback(url){
    clearFallbackWatch();
    pending=true;
    lastTick=Date.now();
    driftTimer=setInterval(function(){
      var now=Date.now();
      if(now-lastTick>900)markLeftApp();
      lastTick=now;
    },250);
    fallbackTimer=setTimeout(function(){
      if(pending&&document.visibilityState==="visible")showManual(url);
    },2500);
  }

  function openExternalIOS(url,plan){
    if(plan.mode==="manual"){
      showManual(url);
      return;
    }
    watchIOSFallback(url);
    try{ window.location.href=plan.scheme; }catch(error){ showManual(url); }
  }

  function openExternalAndroid(url,plan){
    pending=true;
    try{ window.location.href=plan.scheme; }catch(error){}
    fallbackTimer=setTimeout(function(){
      pending=false;
      if(document.visibilityState==="visible"){
        try{ window.location.href=url; }catch(error){}
      }
    },1500);
  }

  function openTarget(url){
    if(!/^https?:\/\//i.test(url))url="https://"+url;
    var plan=getLaunchPlan(url,userAgent());

    if(plan.os==="ios"&&plan.mode!=="direct"){
      openExternalIOS(url,plan);
      return;
    }

    if(plan.os==="android"&&plan.mode==="android-intent"){
      openExternalAndroid(url,plan);
      return;
    }

    window.location.href=url;
  }

  document.addEventListener("visibilitychange",function(){
    if(document.hidden)markLeftApp();
  });
  window.addEventListener("pagehide",markLeftApp);
  window.addEventListener("blur",markLeftApp);

  var manualCopy=document.getElementById("manual-copy");
  var manualContinue=document.getElementById("manual-continue");
  if(manualCopy){
    manualCopy.addEventListener("click",function(){
      if(!currentTarget)return;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(currentTarget).then(function(){
          manualCopy.textContent="Enlace copiado";
        }).catch(function(){
          manualCopy.textContent=currentTarget;
        });
      }else{
        manualCopy.textContent=currentTarget;
      }
    });
  }
  if(manualContinue){
    manualContinue.addEventListener("click",function(){
      if(!currentTarget)return;
      closeManual();
      window.location.href=currentTarget;
    });
  }

  document.addEventListener("click",function(event){
    var button=event.target.closest&&event.target.closest("[data-of-launch]");
    if(!button)return;
    event.preventDefault();
    var target=decodeTarget(OF_PARTS);
    if(!target)return;
    document.dispatchEvent(new CustomEvent("halo-track",{detail:{eventType:"click",extra:{label:"onlyfans",destination:target}}}));
    openTarget(target);
  },true);

  var params=new URLSearchParams(window.location.search);
  if(params.get("debug")==="1"){
    var target=decodeTarget(OF_PARTS);
    var plan=getLaunchPlan(target,userAgent());
    var panel=document.getElementById("debug-panel");
    if(panel){
      panel.hidden=false;
      panel.textContent=[
        "debug=1",
        "app: "+plan.app,
        "os: "+plan.os,
        "mode: "+plan.mode,
        "scheme: "+(plan.scheme||"manual instructions")
      ].join("\n");
    }
  }

  window.__rachelDeeplink={detectApp:detectApp,detectOS:detectOS,getLaunchPlan:getLaunchPlan,buildAndroidIntent:buildAndroidIntent};
})();
</script>
<script>
(function(){
  var VERSION=Date.now().toString();
  var DEFAULT_EXTENSIONS=['jpg','jpeg','png','webp','avif','gif','svg',''];
  document.querySelectorAll('img[data-src-base]').forEach(function(img){
    var base=img.getAttribute('data-src-base');
    var extensions=(img.getAttribute('data-src-exts')||DEFAULT_EXTENSIONS.join(',')).split(',');
    var index=0;
    var tried={};
    tried[img.getAttribute('src')]=true;
    function tryNext(){
      while(index<extensions.length){
        var extension=extensions[index++].trim();
        var nextSrc=base+(extension?'.'+extension:'')+'?v='+VERSION;
        if(tried[nextSrc])continue;
        tried[nextSrc]=true;
        img.src=nextSrc;
        return;
      }
    }
    img.addEventListener('error',tryNext);
    tryNext();
  });
})();
</script>
