<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0c0b09; --champagne: #d4b98c; --champ-lt: #ede0c8; --champ-dim: #9a8060; --border-gold: rgba(212,185,140,.32); --border: rgba(212,185,140,.13); --white: #f5f0e8; --muted: #6a5f50; }
html, body { background: var(--bg); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ''; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: radial-gradient(ellipse at 50% 30%, rgba(212,185,140,.07) 0%, transparent 70%); pointer-events: none; }
.page { min-height: 100vh; min-height: 100dvh; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 28px 60px; position: relative; }
.wordmark { font-family: 'Cormorant', serif; font-size: .72rem; font-weight: 300; letter-spacing: .42em; text-transform: uppercase; color: var(--champ-dim); margin-bottom: 52px; animation: up .7s ease both; }
.avatar-wrap { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 36px; animation: up .7s .12s ease both; opacity: 0; animation-fill-mode: both; }
.avatar-ring { position: absolute; width: 210px; height: 210px; border-radius: 50%; border: 1px dashed rgba(212,185,140,.28); animation: spin 18s linear infinite; }
.avatar-ring::before { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; background: var(--champagne); border-radius: 50%; opacity: .6; }
@keyframes spin { to { transform: rotate(360deg); } }
.avatar-ring-solid { position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 1px solid var(--border-gold); }
.avatar { width: 172px; height: 172px; border-radius: 50%; overflow: hidden; background: #1a1814; position: relative; z-index: 1; border: 3px solid var(--bg); }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
.avatar-badge { position: absolute; bottom: 20px; right: 32px; z-index: 2; width: 15px; height: 15px; background: rgba(12,11,9,.95); border: 2px solid var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 18px rgba(72, 220, 132, .28); }
.badge-dot { width: 9px; height: 9px; background: #48dc84; border-radius: 50%; box-shadow: 0 0 10px rgba(72, 220, 132, .9); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.65)} }
.name-block { text-align: center; margin-bottom: 44px; animation: up .7s .22s ease both; opacity: 0; animation-fill-mode: both; }
.name { font-family: 'Cormorant', serif; font-size: 3.4rem; font-weight: 600; color: var(--white); line-height: .9; }
.name em { display: block; font-weight: 300; font-style: italic; color: var(--champagne); font-size: 3rem; }
.handle { display: block; font-size: .65rem; font-weight: 400; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-top: 12px; text-decoration: none; transition: color .18s; }
.handle:hover, .handle:focus-visible { color: var(--champagne); }
.divider { width: 48px; height: 1px; background: var(--border-gold); margin: 14px auto 0; opacity: .5; }
.cta-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: up .7s .32s ease both; opacity: 0; animation-fill-mode: both; }
.cta-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 340px; min-height: 56px; background: var(--champagne); color: #0c0b09; border-radius: 14px; padding: 20px 32px; font-family: 'DM Sans', sans-serif; font-size: .82rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; position: relative; overflow: hidden; transition: background .22s, transform .18s, box-shadow .22s; touch-action: manipulation; }
.cta-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.25) 50%, transparent 70%); transform: translateX(-120%); transition: transform .55s ease; }
.cta-btn:hover::after { transform: translateX(130%); }
.cta-btn:hover { background: var(--champ-lt); transform: translateY(-3px); box-shadow: 0 16px 40px rgba(212,185,140,.22); }
.cta-btn:focus-visible { outline: 2px solid var(--champ-lt); outline-offset: 4px; }
.cta-btn svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform .2s; }
.cta-btn:hover svg { transform: translateX(3px); }
.cta-note { font-size: .62rem; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.footer { position: absolute; bottom: 28px; left: 0; right: 0; text-align: center; animation: up .6s .5s ease both; opacity: 0; animation-fill-mode: both; }
.footer p { font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); opacity: .5; line-height: 2.2; }
@keyframes up { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
@media(max-width:380px){ .name{font-size:2.9rem} .name em{font-size:2.5rem} .avatar{width:148px;height:148px} .avatar-ring{width:186px;height:186px} .avatar-ring-solid{width:168px;height:168px} }
</style>
<!-- ContentHub Analytics -->
<script>
(function(){
  var SLUG='rachel-sweet-home';
  var sid=sessionStorage.getItem('_ch_sid')||Math.random().toString(36).slice(2)+Date.now().toString(36);
  sessionStorage.setItem('_ch_sid',sid);
  function send(p){fetch('https://social.agenciaonlyfans.es/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).catch(function(){});}
  send({creatorSlug:SLUG,eventType:'pageview',referrer:document.referrer,sessionId:sid});
  document.addEventListener('click',function(e){var el=e.target.closest('[data-track]');if(!el)return;send({creatorSlug:SLUG,eventType:'click',label:el.getAttribute('data-track'),referrer:document.referrer,sessionId:sid});});
})();
</script>
</head>
<body>

    </div>

    </a>

  <div class="footer">
    <p>Content Creator - Contenido exclusivo para adultos</p>
  </div>
</div>
<script>
(function(){
  var VERSION=Date.now().toString();
  var EXTENSIONS=['jpg','jpeg','png','webp','avif','gif','svg',''];
  document.querySelectorAll('img[data-src-base]').forEach(function(img){
    var base=img.getAttribute('data-src-base');
    var index=0;
    var tried={};
    tried[img.getAttribute('src')]=true;
    function tryNext(){
      while(index<EXTENSIONS.length){
        var extension=EXTENSIONS[index++].trim();
        var nextSrc=base+(extension?'.'+extension:'')+'?v='+VERSION;
        if(tried[nextSrc])continue;
        tried[nextSrc]=true;
        img.src=nextSrc;
        return;
      }
    }
    img.addEventListener('error',tryNext);
    tryNext();
  });
})();
</script>
