<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rachel Sweet</title>
<meta name="description" content="Rachel Sweet. Entra para ver mis enlaces oficiales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --panel: #000; --text: #fff; --soft: rgba(255,255,255,.12); --blue: #6c7dff; --online: #39e985; }
html, body { min-height: 100vh; background: #070808; color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
.page { width: min(100%, 460px); min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: linear-gradient(160deg, #000 0%, #061114 46%, #000 100%); border-left: 1px solid rgba(255,255,255,.14); border-right: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 70px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 20px 18px; position: relative; overflow: hidden; }
.page::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 14%, rgba(255,255,255,.11), transparent 32%), linear-gradient(135deg, rgba(0,175,240,.18), transparent 34%, rgba(255,255,255,.045) 55%, transparent 72%); pointer-events: none; }
.page::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 44px 44px; opacity: .18; mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); pointer-events: none; }
.profile { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; animation: up .45s ease both; }
.avatar-wrap { position: relative; width: clamp(132px, 39vw, 168px); height: clamp(132px, 39vw, 168px); flex: 0 0 auto; border-radius: 50%; padding: 4px; background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(255,255,255,.12) 42%, rgba(108,125,255,.46)); box-shadow: 0 18px 45px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.08); }
.avatar { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #151515; border: 3px solid #000; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 16%; display: block; }
.online-dot { position: absolute; right: 10%; bottom: 9%; width: 16px; height: 16px; border-radius: 50%; background: var(--online); border: 3px solid #000; box-shadow: 0 0 15px rgba(57,233,133,.7); }
.location-line { min-height: 36px; margin-top: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 17px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(255,255,255,.08); color: #fff; font-size: .86rem; line-height: 1; font-weight: 900; box-shadow: 0 12px 30px rgba(0,0,0,.22); backdrop-filter: blur(8px); }
.location-line svg { width: 15px; height: 15px; flex: 0 0 15px; }
.profile-name { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: clamp(1.75rem, 8vw, 2.45rem); line-height: 1; font-weight: 900; letter-spacing: -.035em; color: #fff; }
.verified-badge { width: 27px; height: 27px; flex: 0 0 27px; filter: drop-shadow(0 2px 8px rgba(88,101,242,.55)); }
.hero-socials { display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 12px; }
.hero-social { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; color: #fff; background: rgba(255,255,255,.055); text-decoration: none; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
.hero-social:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.34); }
.hero-social svg { width: 16px; height: 16px; }
.cta { display: flex; align-items: center; justify-content: center; gap: 11px; width: 100%; min-height: 58px; margin-top: 22px; border: 1px solid rgba(255,255,255,.72); border-radius: 16px; background: linear-gradient(135deg, #fff 0%, #dff7ff 48%, #7ddcff 100%); color: #020506; text-decoration: none; font-size: .88rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; touch-action: manipulation; position: relative; overflow: hidden; box-shadow: 0 16px 36px rgba(0,175,240,.25), 0 0 0 5px rgba(255,255,255,.055); animation: ctaPulse 2.8s ease-in-out infinite; transition: transform .18s ease, box-shadow .18s ease; }
.cta::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 0%, transparent 28%, rgba(255,255,255,.72) 45%, transparent 62%, transparent 100%); transform: translateX(-130%); animation: ctaShine 3.4s ease-in-out infinite; }
.cta:hover { transform: translateY(-3px); box-shadow: 0 20px 46px rgba(0,175,240,.36), 0 0 0 6px rgba(255,255,255,.07); }
.cta span, .cta svg { position: relative; z-index: 1; }
.cta svg { width: 17px; height: 17px; transition: transform .18s ease; }
.cta:hover svg { transform: translateX(3px); }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ctaShine { 0%, 45% { transform: translateX(-130%); } 75%, 100% { transform: translateX(130%); } }
@keyframes ctaPulse { 0%, 100% { box-shadow: 0 16px 36px rgba(0,175,240,.25), 0 0 0 5px rgba(255,255,255,.055); } 50% { box-shadow: 0 20px 48px rgba(0,175,240,.38), 0 0 0 7px rgba(255,255,255,.08); } }
@media (max-width: 400px) {
  .page { border-left: 0; border-right: 0; padding-left: 14px; padding-right: 14px; }
  .verified-badge { width: 24px; height: 24px; flex-basis: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="page">
  <main class="profile" aria-label="Rachel Sweet">
    <div class="avatar-wrap">
      <div class="avatar">
        <img src="./assets/images/home-avatar.jpg" data-src-base="./assets/images/home-avatar" data-src-exts="jpg,jpeg,png,webp,avif,gif" alt="Rachel Sweet">
      </div>
      <div class="online-dot" aria-hidden="true"></div>
    </div>

    <div class="location-line" id="visitor-location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span>Detectando zona...</span>
    </div>

    <div class="profile-name">
      <span>Rachel Sweet</span>
      <svg class="verified-badge" viewBox="0 0 24 24" aria-label="Cuenta verificada" role="img">
        <path fill="#6c7dff" d="M12 2.3 14.1 4l2.7-.2 1.2 2.4 2.5 1-.4 2.7 1.4 2.3-1.4 2.3.4 2.7-2.5 1-1.2 2.4-2.7-.2L12 22l-2.1-1.7-2.7.2L6 18.1l-2.5-1 .4-2.7-1.4-2.3 1.4-2.3-.4-2.7 2.5-1 1.2-2.4 2.7.2L12 2.3Z"/>
        <path fill="#fff" d="m10.8 14.3 5.1-5.1 1.2 1.2-6.3 6.3-3.7-3.7 1.2-1.2 2.5 2.5Z"/>
      </svg>
    </div>

    <div class="hero-socials" aria-label="Redes sociales de Rachel Sweet">
      <a href="https://www.instagram.com/bbyraachel/" target="_blank" rel="noopener" class="hero-social" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17" cy="7" r=".8" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="https://x.com/raachelsweet" target="_blank" rel="noopener" class="hero-social" aria-label="Twitter X">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13.92 10.62 21.36 2h-1.76l-6.46 7.48L7.98 2H2.03l7.8 11.31L2.03 22h1.76l6.82-7.58L16.06 22h5.95l-8.09-11.38Zm-2.41 2.67-.79-1.13L4.43 3.32h2.71l5.08 7.16.79 1.13 6.59 9.12h-2.71l-5.38-7.44Z"/>
        </svg>
      </a>
    </div>

    <a href="./links.html" class="cta" data-halo-click="links-page">
      <span>Entrar ahora</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </main>
</div>
<script>
(function(){
  var HALO_ENDPOINT='https://halo-panel.vercel.app/api/landing-track';
  var HALO_LANDING_SLUG='rachel-sweet';
  var HALO_LANDING_KEY='lk_rachel_sweet_cambia_esto';
  var SESSION_KEY='halo_landing_session_rachel_sweet';

  function getSessionId(){
    try{
      var id=localStorage.getItem(SESSION_KEY);
      if(!id){
        id=(crypto.randomUUID&&crypto.randomUUID())||(Math.random().toString(36).slice(2)+Date.now().toString(36));
        localStorage.setItem(SESSION_KEY,id);
      }
      return id;
    }catch(e){
      return Math.random().toString(36).slice(2)+Date.now().toString(36);
    }
  }

  function trackHaloLanding(eventType,extra){
    var payload=JSON.stringify(Object.assign({
      landingSlug:HALO_LANDING_SLUG,
      landingKey:HALO_LANDING_KEY,
      eventType:eventType,
      sessionId:getSessionId(),
      referrer:document.referrer,
      page:location.pathname,
      url:location.href,
      userAgent:navigator.userAgent,
      timestamp:new Date().toISOString()
    },extra||{}));

    if(navigator.sendBeacon){
      navigator.sendBeacon(HALO_ENDPOINT,new Blob([payload],{type:'application/json'}));
      return;
    }

    fetch(HALO_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      keepalive:true,
      body:payload
    }).catch(function(){});
  }

  trackHaloLanding('pageview');

  document.addEventListener('click', function(event){
    var link = event.target.closest && event.target.closest('a[href]');
    if(!link) return;

    var href = link.href || link.getAttribute('href') || '';
    var text = (link.getAttribute('aria-label') || link.textContent || '').trim().slice(0,80);
    var isLinksPage = /links\.html/i.test(href) || /links/i.test(text);

    trackHaloLanding('click', {
      label: link.getAttribute('data-halo-of-click') ||
        link.getAttribute('data-halo-click') ||
        (isLinksPage ? 'links-page' : text || 'link'),
      destination: href
    });
  }, true);
})();
</script>
<script>
(function(){
  var line=document.getElementById('visitor-location');
  if(!line)return;

  function fallback(){
    line.querySelector('span').textContent='Cerca de ti';
  }

  var controller=window.AbortController?new AbortController():null;
  var timeout=setTimeout(function(){
    if(controller)controller.abort();
    fallback();
  },2200);

  fetch('https://ipapi.co/json/',{signal:controller&&controller.signal})
    .then(function(response){ return response.ok ? response.json() : null; })
    .then(function(data){
      clearTimeout(timeout);
      if(data&&(data.city||data.country_code||data.country)){
        var countryCode=(data.country_code||data.country||'').toString().toUpperCase();
        var place=[data.city,countryCode].filter(Boolean).join(', ');
        line.querySelector('span').textContent=place;
        return;
      }
      fallback();
    })
    .catch(function(){
      clearTimeout(timeout);
      fallback();
    });
})();
</script>
<script>
(function(){
  var VERSION=Date.now().toString();
  var EXTENSIONS=['jpg','jpeg','png','webp','avif','gif','svg',''];
  document.querySelectorAll('img[data-src-base]').forEach(function(img){
    var base=img.getAttribute('data-src-base');
    var index=0;
    var tried={};
    tried[img.getAttribute('src')]=true;
    function tryNext(){
      while(index<EXTENSIONS.length){
        var extension=EXTENSIONS[index++].trim();
        var nextSrc=base+(extension?'.'+extension:'')+'?v='+VERSION;
        if(tried[nextSrc])continue;
        tried[nextSrc]=true;
        img.src=nextSrc;
        return;
      }
    }
    img.addEventListener('error',tryNext);
    tryNext();
  });
})();
</script>
</body>
</html>
